# Postgres สำหรับพัฒนาในเครื่อง: docker compose up -d db
# พอร์ต 5433 (ไม่ชนกับ Postgres อื่นที่อาจรันอยู่ที่ 5432)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_studio
      POSTGRES_PASSWORD: test_studio
      POSTGRES_DB: test_studio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
